name: Deploy Portfolio Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci --prefix portfolio-site

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /mazhar-ai-lab
        run: npm run build --prefix portfolio-site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mazhar Jahjah — AI Engineer</title>
    <script>
      // Save the full path the user wanted, then redirect to the SPA root.
      // The root index.html will read this and hand it to React Router.
      var dest = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('spa_redirect', dest);
      window.location.replace('/mazhar-ai-lab/');
    </script>
  </head>
  <body></body>
</html>

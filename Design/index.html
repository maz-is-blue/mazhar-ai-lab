<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mazhar Jahjah — AI Engineer</title>
    <script>
      // GitHub Pages SPA: restore path from query string set by 404.html
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Handle ?p= redirect from 404.html
        var query = window.location.search;
        if (query.startsWith('?p=/')) {
          var path = query.slice(3).replace(/~and~/g, '&');
          var rest = path.split('&q=');
          history.replaceState(null, null,
            window.location.pathname + rest[0] + (rest[1] ? '?' + rest[1] : '') + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

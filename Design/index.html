<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mazhar Jahjah — AI Engineer</title>
    <script>
      // Restore the path that was saved by 404.html before React mounts.
      (function () {
        var dest = sessionStorage.getItem('spa_redirect');
        if (dest) {
          sessionStorage.removeItem('spa_redirect');
          // Only replace if it differs from current location
          if (dest !== window.location.pathname + window.location.search + window.location.hash) {
            window.history.replaceState(null, null, dest);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
